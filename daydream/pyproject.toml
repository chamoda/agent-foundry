[project]
name = "daydream-agent"
version = "1.2.3"
description = "Continuous AI agent that daydreams up new work: researches the codebase and a maintainer VISION.md, then files well-researched issues. Powered by opencode."
requires-python = ">=3.12"
dependencies = [
    "foundry-core",
    "PyGithub>=2.3",
]

[project.scripts]
daydream = "daydream.agent:main"

[tool.uv.sources]
foundry-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daydream"]
