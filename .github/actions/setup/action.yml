name: "Setup uv + opencode"
description: "Shared setup: installs uv and the opencode CLI. Used by all agent actions."
author: "Chamoda Pandithage"

inputs:
  github-token:
    description: "GitHub token for API calls."
    required: true
  opencode-api-key:
    description: "OpenCode Zen API key, if the configured model requires auth."
    required: false
    default: ""
  model:
    description: "opencode model id (provider/model)."
    required: false
    default: "opencode/mimo-v2.5-free"
  variant:
    description: "Reasoning effort passed to `opencode run --variant` (high/max/minimal). Empty to disable."
    required: false
    default: "high"
  plan:
    description: "Plan first (read-only plan agent) then build. Set 'false' for a single build pass."
    required: false
    default: "true"

outputs:
  opencode-bin:
    description: "Path to the opencode binary directory."
    value: ${{ steps.install-opencode.outputs.opencode-bin }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install opencode
      id: install-opencode
      shell: bash
      run: |
        curl -fsSL https://opencode.ai/install | bash
        echo "opencode-bin=$HOME/.opencode/bin" >> "$GITHUB_OUTPUT"

    - name: Add opencode to PATH
      shell: bash
      run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
