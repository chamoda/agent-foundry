name: "lucid-agent"
description: "[DEPRECATED — no longer maintained, may be removed in v2] Researches newly opened issues in depth and posts an ICE/RICE priority score as a comment. Powered by opencode."
author: "Chamoda Pandithage"
branding:
  icon: "eye"
  color: "purple"

inputs:
  github-token:
    description: "Token for the gh API (reads the issue, posts the score comment)."
    required: true
    default: ${{ github.token }}
  opencode-api-key:
    description: "OpenCode Zen API key, if the configured model requires auth."
    required: false
    default: ""
  mcp-config:
    description: "Path to a project MCP config (Claude Code `.mcp.json` format) whose servers are exposed to opencode. Empty to disable the passthrough."
    required: false
    default: ".mcp.json"
  model:
    description: "opencode model id (provider/model)."
    required: false
    default: "opencode/mimo-v2.5-free"
  variant:
    description: "Reasoning effort passed to `opencode run --variant` (high/max/minimal). Empty to disable."
    required: false
    default: "high"
  plan:
    description: "Research first (read-only plan agent) then write. Set 'false' for a single pass."
    required: false
    default: "true"
  agent-timeout:
    description: "Max seconds for a single opencode pass before it is killed (plan and build each get this). Guards against silent stalls. 0 disables."
    required: false
    default: "3600"
  method:
    description: "Scoring method: 'ice' (Impact × Confidence × Ease) or 'rice' ((Reach × Impact × Confidence) ÷ Effort)."
    required: false
    default: "ice"
  vision-file:
    description: "Path (relative to repo root) of the maintainer vision file, used to judge impact/alignment."
    required: false
    default: "VISION.md"
  opencode-version:
    description: "opencode version to install (pinned for supply-chain safety). To bump: download the install script from https://opencode.ai/install, compute its sha256, and update both this version and the checksum below."
    required: false
    default: "1.17.15"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install opencode
      shell: bash
      env:
        OPENCODE_VERSION: ${{ inputs.opencode-version }}
      run: |
        INSTALL_SCRIPT=$(mktemp)
        trap 'rm -f "$INSTALL_SCRIPT"' EXIT
        curl -fsSL -o "$INSTALL_SCRIPT" https://opencode.ai/install
        # To bump: download the new script, run sha256sum on it, and replace the hash below.
        EXPECTED_SHA256="fc3c1b2123f49b6df545a7622e5127d21cd794b15134fc3b66e1ca49f7fb297e"
        echo "${EXPECTED_SHA256}  ${INSTALL_SCRIPT}" | sha256sum --check --strict
        bash "$INSTALL_SCRIPT" --version "$OPENCODE_VERSION"

    - name: Run lucid-agent
      shell: bash
      env:
        OPENCODE_MODEL: ${{ inputs.model }}
        OPENCODE_VARIANT: ${{ inputs.variant }}
        OPENCODE_PLAN: ${{ inputs.plan }}
        OPENCODE_TIMEOUT: ${{ inputs.agent-timeout }}
        SCORE_METHOD: ${{ inputs.method }}
        VISION_FILE: ${{ inputs.vision-file }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key }}
        MCP_CONFIG: ${{ inputs.mcp-config }}
        # Event context (set by GitHub on the consumer's workflow run).
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        DISPATCH_ISSUE: ${{ github.event.inputs.issue }}
      run: |
        export PATH="$HOME/.opencode/bin:$PATH"
        # Run from the consumer's checked-out repo (cwd). $GITHUB_ACTION_PATH is
        # this action's directory inside the monorepo; uv discovers the
        # workspace root above it and uses the shared lockfile.
        uv run --project "$GITHUB_ACTION_PATH" python -m lucid
