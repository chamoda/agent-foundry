[project]
name = "nightwatch-agent"
version = "1.1.3"
description = "Continuous AI agent that keeps watch over your repo: picks up open issues and proposes solutions as pull requests. Powered by opencode."
requires-python = ">=3.12"
dependencies = [
    "foundry-core",
    "PyGithub>=2.3",
]

[project.scripts]
nightwatch = "nightwatch.agent:main"

[tool.uv.sources]
foundry-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightwatch"]
