[project]
name = "agent-foundry"
version = "0.0.0"
description = "A monorepo of continuous AI agents for GitHub repos, powered by opencode."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Chamoda Pandithage" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/chamoda/agent-foundry"
Repository = "https://github.com/chamoda/agent-foundry"
"Bug Tracker" = "https://github.com/chamoda/agent-foundry/issues"

[tool.uv.workspace]
members = ["core", "nightwatch", "daydream", "lucid", "warden"]
