[project]
name = "warden-agent"
version = "1.0.3"
description = "Continuous AI agent that reviews pull requests quickly and posts inline review comments, focused on security and matching existing code patterns. Powered by opencode."
requires-python = ">=3.12"
dependencies = [
    "foundry-core",
    "PyGithub>=2.3",
]

[project.scripts]
warden = "warden.agent:main"

[tool.uv.sources]
foundry-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]
