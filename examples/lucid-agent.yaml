name: lucid-agent
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to score"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  lucid:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: chamoda/agent-foundry/lucid@v1
