name: daydream-agent
on:
  schedule:
    - cron: "0 12 * * *" # daily at noon UTC
  workflow_dispatch:

concurrency:
  group: daydream-agent
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  daydream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: chamoda/agent-foundry/daydream@v1
