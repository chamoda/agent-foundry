name: warden-agent
on:
  pull_request:
    # `closed` fires when the PR is merged/closed: it joins the same per-PR
    # concurrency group and cancels any in-flight review (the job is skipped).
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review"
        required: true
        type: string

concurrency:
  # One review at a time per PR. A newer push supersedes an in-flight run, and
  # merging/closing the PR cancels a running review.
  group: warden-agent-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  warden:
    runs-on: ubuntu-24.04
    # Skip the review when the PR is closed/merged — that run exists only to
    # cancel an in-progress review via the concurrency group above.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so re-reviews can diff only the new commits
      - uses: chamoda/agent-foundry/warden@v1
