[project]
name = "foundry-core"
version = "1.1.0"
description = "Shared core for agent-foundry agents: env config, shell helpers, the opencode driver, and GitHub utilities."
requires-python = ">=3.12"
dependencies = [
    "PyGithub>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_core"]
