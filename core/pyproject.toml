[project]
name = "foundry-core"
version = "1.2.0"
description = "Shared core for agent-foundry agents: env config, shell helpers, the opencode driver, and GitHub utilities."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Chamoda Pandithage" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyGithub>=2.3",
]

[project.urls]
Homepage = "https://github.com/chamoda/agent-foundry"
Repository = "https://github.com/chamoda/agent-foundry"
"Bug Tracker" = "https://github.com/chamoda/agent-foundry/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_core"]
